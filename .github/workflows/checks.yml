name: Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: vid-engine/requirements*.txt
      - run: python -m pip install -r vid-engine/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: vid-engine

  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npx playwright install-deps chromium
        if: runner.os == 'Linux'
      - run: npx vitest run tests/managed-processes.test.ts
      - run: xvfb-run -a npm run test:electron
        if: runner.os == 'Linux'
      - run: npm run test:electron
        if: runner.os != 'Linux'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
